<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Libreta - Registro de Préstamos y Fiados</title>
  </head>
  <body>
    <script>
      // Apply theme + background color immediately to prevent FOUC.
      // The class alone isn't enough: Tailwind CSS loads via Vite (async),
      // so without an inline style the html/body show the browser default
      // (white) for one frame before the dark class can take effect.
      (function() {
        var theme = localStorage.getItem('theme') || 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        // tailwindcss slate-50 = #f8fafc (light bg), slate-950 = #020617 (dark bg)
        var bg = theme === 'dark' ? '#020617' : '#f8fafc';
        document.documentElement.style.backgroundColor = bg;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
